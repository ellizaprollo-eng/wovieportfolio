<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Form registration</title>
  </head>
  <body>
    <!--
      This file exists only so Netlify's build-time form detection registers the
      "proposal-request" form. It is never shown to visitors — the real form is
      the React component in src/components/estimator/ProposalModal.tsx, which
      POSTs here. Every field the React form submits must be listed below.
    -->
    <form name="proposal-request" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input type="text" name="name" />
      <input type="email" name="email" />
      <input type="text" name="company" />
      <textarea name="goals"></textarea>
      <input type="date" name="startDate" />
      <input type="text" name="scope" />
      <input type="text" name="estimate" />
      <input type="text" name="bot-field" />
    </form>
  </body>
</html>
